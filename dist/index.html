<!doctype html>
<html lang="mn">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Нэргүй Өндөр өрөмдлөгийн явц, цооног болон ээлжийн гүйцэтгэлийн хяналт">
  <title>Өрөмдлөгийн явц · Нэргүй Өндөр</title>
  <link rel="stylesheet" href="style.css?v=20261015.18">
  <link rel="stylesheet" href="vendor/leaflet.css">
  <link rel="stylesheet" href="mapping.css?v=20261028.1">
  <link rel="stylesheet" href="financial.css?v=20261028.2">
  <link rel="stylesheet" href="dark-theme.css?v=20261028.1" id="dark-theme">
  <script>(function(){var t;try{t=localStorage.getItem('drilling-theme')}catch(e){}if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.dataset.theme=t;document.getElementById('dark-theme').media=t==='dark'?'all':'not all'})();</script>
</head>
<body>
  <aside>
    <div class="nav-label">ХЯНАЛТЫН САМБАР</div>
    <nav aria-label="Үндсэн цэс">
      <button class="active" data-tab="overview">◫ <span>Ерөнхий тойм</span></button>
      <button data-tab="financial">₮ <span>Санхүүгийн үзүүлэлтүүд</span></button>
      <button data-tab="mapping">⌖ <span>Mapping</span></button>
      <button data-tab="shifts">≋ <span>Ээлжийн тайлан</span></button>
      <button data-tab="data-log">◷ <span>Data Log</span></button>
      <button data-tab="sources">▤ <span>Эх сурвалж & хяналт</span></button>
    </nav>
  </aside>
  <main>
    <header><h1>Өрөмдлөгийн явц</h1><div class="chart-periods theme-switch" role="group" aria-label="Өнгөний горим"><button type="button" data-theme-choice="light" aria-pressed="false">☀︎ Цайвар</button><button type="button" data-theme-choice="dark" aria-pressed="false">☾ Бараан</button></div></header>
    <div class="toolbar">
      <div class="filter"><label for="site">Талбай</label><select id="site"><option>Нэргүй Өндөр</option></select></div>
      <div class="filter"><label for="area">Участик</label><select id="area"><option value="">Бүх участик</option><option>Дорнын Төмөр</option><option>Замт Хөндий</option></select></div>
      <div class="filter"><label for="rig">Өрөм</label><select id="rig"><option value="">Бүх өрөм</option><option>C-1800</option><option>CSD-1300</option></select></div>
      <div class="period">Тайлант хугацаа <strong>—</strong></div>
      <button id="export" class="button">CSV татах ↓</button>
    </div>
    <p id="load-error" role="status" hidden></p>
    <div id="app" aria-live="polite"><div class="empty">Өгөгдөл ачаалж байна…</div></div>
  </main>
  <dialog id="detail"><button class="close" aria-label="Хаах">×</button><div id="detail-body"></div></dialog>
  <div id="bar-tooltip" role="tooltip" hidden></div>
  <script src="chart-model.js?v=20261015.18"></script><script src="financial-costs.js?v=20261027.1"></script><script src="vendor/leaflet.js"></script><script src="vendor/proj4.js"></script><script src="map-model.js?v=20261019.1"></script><script src="app.js?v=20261028.2"></script>
</body>
</html>
