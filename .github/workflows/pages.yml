name: Deploy Drilling Progress to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Python and browser code
        run: |
          python -B -m unittest test_drilling_sync -v
          python -B -m unittest test_chat_report -v
          python -B validate_data.py
          node --check dist/app.js
          node test_chart.cjs
          node test_financial_costs.cjs
          node test_finance_dashboard.cjs
          node test_mapping.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
