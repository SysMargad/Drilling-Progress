name: Sync drilling data from Google Drive

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/drive-sync.yml'
      - 'drilling_sync.py'
      - 'validate_data.py'
      - 'requirements.txt'
  schedule:
    # Same daily timing as Drone Track: 08:00 Asia/Shanghai.
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      chat_date:
        description: 'Google Chat руу дахин илгээх огноо (YYYY-MM-DD). Хоосон бол зөвхөн шинэ ээлжийг илгээнэ.'
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: drive-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Keep pre-sync data for the Google Chat report
        run: cp dist/data.json "$RUNNER_TEMP/previous-data.json"
      - name: Check Drive authentication
        id: credentials
        env:
          GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          if [[ -n "$GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON" ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Configure GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON and folder access to enable Drive sync.'
          fi
      - name: Install Drive authentication dependency
        if: steps.credentials.outputs.ready == 'true'
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Read and validate Drive workbooks
        id: collection
        continue-on-error: true
        if: steps.credentials.outputs.ready == 'true'
        env:
          GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON }}
        run: python -B drilling_sync.py --source drive
      - name: Validate dashboard and collection history
        if: steps.credentials.outputs.ready == 'true'
        run: |
          python -B validate_data.py
          python -B -m unittest test_drilling_sync -v
          python -B -m unittest test_chat_report -v
          node test_chart.cjs
          node test_financial_costs.cjs
          node test_finance_dashboard.cjs
          node test_mapping.cjs
      - name: Report collection failure
        if: steps.collection.outcome == 'failure'
        run: echo '::warning::Drive collection failed. Previous valid data and the failed attempt log are preserved.'
      - name: Commit changed data
        id: commit
        if: steps.credentials.outputs.ready == 'true'
        shell: bash
        run: |
          if git diff --quiet -- dist/data.json dist/data-log.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- dist/data.json dist/data-log.json
            git commit -m 'Sync validated drilling data from Drive'
            git push origin HEAD:main
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Post new shifts to Google Chat
        # A failed post must not hold back the Pages deploy of the synced data.
        if: steps.commit.outputs.changed == 'true' || inputs.chat_date
        continue-on-error: true
        env:
          GOOGLE_CHAT_WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}
          CHAT_DATE: ${{ inputs.chat_date }}
        shell: bash
        run: |
          if [[ -z "$GOOGLE_CHAT_WEBHOOK_URL" ]]; then
            echo '::notice::Configure GOOGLE_CHAT_WEBHOOK_URL to post daily drilling progress to Google Chat.'
          elif [[ -n "$CHAT_DATE" ]]; then
            python -B chat_report.py --date "$CHAT_DATE"
          else
            python -B chat_report.py --previous "$RUNNER_TEMP/previous-data.json"
          fi
  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy refreshed data
        id: deployment
        uses: actions/deploy-pages@v4
