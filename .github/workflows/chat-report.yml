name: Post drilling progress to Google Chat

on:
  # chat_trigger.gs (Google Apps Script) starts the evening run between 19:30 and
  # 20:00 UTC+8. GitHub's own schedule started runs 5–7 hours late, after midnight.
  workflow_dispatch:
    inputs:
      chat_date:
        description: 'Дахин илгээх огноо (YYYY-MM-DD). Хоосон бол хоёр өрмийн хамгийн сүүлийн өдрийг илгээнэ.'
        required: false
      evening:
        description: '20:00 (UTC+8) хүртэл хүлээгээд илгээх'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: chat-report
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Wait until 20:00 UTC+8
        if: inputs.evening
        run: |
          wait=$(( $(date -u -d '12:00' +%s) - $(date -u +%s) ))
          if (( wait > 0 && wait <= 2700 )); then sleep "$wait"; fi
      - uses: actions/checkout@v4
        with:
          # Check out after the wait so data committed meanwhile is included.
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Post the rigs' latest dates
        env:
          GOOGLE_CHAT_WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}
          CHAT_DATE: ${{ inputs.chat_date }}
          EVENING: ${{ inputs.evening }}
          # Evening posts paused by the owner on these dates (UTC+8, space-separated, e.g. '2026-11-08').
          PAUSED_DATES: ''
        shell: bash
        run: |
          today=$(TZ=Asia/Ulaanbaatar date +%F)
          if [[ "$EVENING" == 'true' && " $PAUSED_DATES " == *" $today "* ]]; then
            echo "::notice::Evening Chat post paused for $today by the owner."
          elif [[ -z "$GOOGLE_CHAT_WEBHOOK_URL" ]]; then
            echo '::warning::Configure the GOOGLE_CHAT_WEBHOOK_URL secret to post drilling progress to Google Chat.'
          elif [[ -n "$CHAT_DATE" ]]; then
            python -B chat_report.py --date "$CHAT_DATE"
          else
            python -B chat_report.py
          fi
      - name: Record posted shifts
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- chat-posted.json)" ]]; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- chat-posted.json
          git commit -m 'Record shifts posted to Google Chat'
          git pull --rebase --autostash -q origin main
          git push origin HEAD:main
